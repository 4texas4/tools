<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fullscreen HTML Editor — Run Preview</title>
  <style>
    :root{--btn-size:44px;--accent:#6b46c1}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    /* Editor (textarea) fills the whole screen */
    #editor{box-sizing:border-box;display:block;width:100%;height:100%;padding:18px 18px 18px 18px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Courier New', monospace;font-size:14px;line-height:1.45;border:0;outline:none;resize:none;background:#0f1720;color:#e6eef8}

    /* Buttons top-right */
    .top-controls{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:40}
    button.control{height:var(--btn-size);min-width:var(--btn-size);padding:0 12px;border-radius:10px;border:0;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(0,0,0,0.05));color:var(--accent);font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.35);backdrop-filter: blur(4px);display:flex;align-items:center;justify-content:center}{height:var(--btn-size);min-width:var(--btn-size);padding:0 12px;border-radius:10px;border:0;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(0,0,0,0.05));color:var(--accent);font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.35);backdrop-filter: blur(4px)}
    button.control:active{transform:translateY(1px)}
    button.primary{background:var(--accent);color:#fff}

    /* Preview iframe covers whole screen when shown */
    #previewWrap{position:fixed;inset:0;display:none;background:#fff;z-index:30}
    #preview{width:100%;height:100%;border:0}

    /* Close button sits above preview */
    button#closeBtn{position:fixed;top:12px;right:12px;z-index:60;display:none}

    /* Small helper row above editor */
    .hint{position:fixed;left:12px;top:12px;color:#cbd5e1;font-size:13px;z-index:40}

    /* Responsive: reduce padding on small screens */
    @media (max-width:520px){#editor{padding:12px 12px 12px 12px}} 
  </style>
</head>
<body>
  
  <div class="top-controls">
    <button id="runBtn" class="control primary" title="Run (full screen)">Run ▶</button>
  </div>

  <textarea id="editor" spellcheck="false" aria-label="HTML editor">
<!-- Edit the HTML below. Click Run to open a full-screen preview. -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Preview</title>
    <style>body{display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui;background:#f7fafc;color:#0f1720}h1{font-size:clamp(20px,4vw,48px)}</style>
  </head>
  <body>
    <h1>Hello — this is your preview!</h1>
  </body>
</html>
  </textarea>

  <!-- Preview area (hidden until run) -->
  <div id="previewWrap" aria-hidden="true">
    <iframe id="preview" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
  </div>

  <button id="closeBtn" class="control" title="Close preview">✕ Close</button>

  <script>
    const editor = document.getElementById('editor');
    const runBtn = document.getElementById('runBtn');
    const previewWrap = document.getElementById('previewWrap');
    const preview = document.getElementById('preview');
    const closeBtn = document.getElementById('closeBtn');

    function runPreview(){
      preview.srcdoc = editor.value;
      previewWrap.style.display = 'block';
      closeBtn.style.display = 'inline-flex';
      runBtn.style.display = 'none';
      editor.style.visibility = 'hidden';
    }

    function closePreview(){
      preview.srcdoc = '';
      previewWrap.style.display = 'none';
      closeBtn.style.display = 'none';
      runBtn.style.display = 'inline-flex';
      editor.style.visibility = 'visible';
    }

    runBtn.addEventListener('click', runPreview);
    closeBtn.addEventListener('click', closePreview);

    window.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
        e.preventDefault();
        if(previewWrap.style.display === 'block') closePreview(); else runPreview();
      }
      if(e.key === 'Escape'){
        closePreview();
      }
    });
  </script>
</body>
</html>
