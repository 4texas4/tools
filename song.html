<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f0f;
  color: #fff;
}

.search { padding: 4px; }
input {
  width: calc(100% - 8px);
  padding: 8px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  outline: none;
}

#results { padding: 4px; }

.track {
  display: flex;
  gap: 8px;
  padding: 6px;
  border-bottom: 1px solid #1f1f1f;
  cursor: pointer;
  transition: background 0.15s;
}

.track img { width: 48px; height: 48px; border-radius: 6px; }
.track-title { font-size: 13px; font-weight: 600; }
.track-artist { font-size: 11px; opacity: 0.7; }
.track.selected { background: #333; }
</style>
</head>

<body>

<div class="search">
  <input id="query" placeholder="Search SoundCloud" autofocus>
</div>

<div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4/dist/browser-id3-writer.min.js"></script>

<script>
let typingTimer;
const delay = 1000;
const input = document.getElementById("query");
const results = document.getElementById("results");
let selectedIndex = -1;

input.addEventListener("input", () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(search, delay);
});

async function search() {
  const q = input.value.trim();
  if (!q) { results.innerHTML = ""; selectedIndex = -1; return; }

  const query = q.replace(/\s+/g, "+");
  const url = `https://vapor.my/worker/music/soundcloud/search/${query}?max=15&offset=0`;

  const res = await fetch(url);
  const data = await res.json();

  results.innerHTML = "";
  selectedIndex = -1;

  data.results.forEach(track => {
    const div = document.createElement("div");
    div.className = "track";
    div.innerHTML = `
      <img src="${track.artwork}">
      <div>
        <div class="track-title">${track.title}</div>
        <div class="track-artist">${track.artist}</div>
      </div>
    `;
    div.onclick = () => download(track);
    results.appendChild(div);
  });
  updateSelection();
}

function updateSelection() {
  const tracks = document.querySelectorAll(".track");
  tracks.forEach((t,i) => t.classList.toggle("selected", i === selectedIndex));
}

// KaiOS D-pad: Center only, Up/Down are browser-dependent
document.addEventListener("keydown", (e) => {
  const tracks = document.querySelectorAll(".track");
  if (!tracks.length) return;

  if (e.keyCode === 13) { // Center / Enter
    if (selectedIndex >= 0 && selectedIndex < tracks.length) {
      tracks[selectedIndex].click();
    }
  }
});

async function download(track) {
  try {
    const url = new URL(track.url);
    const parts = url.pathname.split("/").filter(Boolean);
    const username = parts[0];
    const slug = parts[1];

    const api = `https://vapor.my/worker/music/soundcloud/download/${username}/${slug}`;
    const res = await fetch(api);
    const data = await res.json();

    const mp3Res = await fetch(data.streamUrl);
    const arrayBuffer = await mp3Res.arrayBuffer();

    const imgRes = await fetch(track.artwork);
    const imgBuffer = await imgRes.arrayBuffer();

    const writer = new ID3Writer(arrayBuffer);
    writer
      .setFrame("TIT2", track.title)
      .setFrame("TPE1", [track.artist])
      .setFrame("TALB", "SoundCloud")
      .setFrame("APIC", { type: 3, data: imgBuffer, description: "Cover" });
    writer.addTag();

    const taggedBlob = new Blob([writer.arrayBuffer], { type: "audio/mpeg" });
    const filename = track.title.replace(/[^a-z0-9\- ]/gi,"").trim().replace(/\s+/g,"-") + ".mp3";

    const a = document.createElement("a");
    a.href = URL.createObjectURL(taggedBlob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch(e) {
    alert("Download failed");
    console.error(e);
  }
}
</script>

</body>
</html>
