<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SC Downloader</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f0f;
  color: #fff;
}

.search {
  padding: 8px;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 15px;
  border-radius: 8px;
  border: none;
  outline: none;
}

#results {
  padding: 6px;
}

.track {
  display: flex;
  gap: 10px;
  padding: 8px;
  border-bottom: 1px solid #1f1f1f;
  cursor: pointer;
}

.track img {
  width: 56px;
  height: 56px;
  border-radius: 6px;
}

.track-title {
  font-size: 14px;
  font-weight: 600;
}

.track-artist {
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="search">
  <input id="query" placeholder="Search SoundCloud">
</div>

<div id="results"></div>

<script>
let typingTimer;
const delay = 1000;

const input = document.getElementById("query");
const results = document.getElementById("results");

input.addEventListener("input", () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(search, delay);
});

async function search() {
  const q = input.value.trim();
  if (!q) {
    results.innerHTML = "";
    return;
  }

  const query = q.replace(/\s+/g, "+");
  const url = `https://vapor.my/worker/music/soundcloud/search/${query}?max=15&offset=0`;

  const res = await fetch(url);
  const data = await res.json();

  results.innerHTML = "";

  data.results.forEach(track => {
    const div = document.createElement("div");
    div.className = "track";

    div.innerHTML = `
      <img src="${track.artwork}">
      <div>
        <div class="track-title">${track.title}</div>
        <div class="track-artist">${track.artist}</div>
      </div>
    `;

    div.onclick = () => download(track);
    results.appendChild(div);
  });
}

async function download(track) {
  try {
    const url = new URL(track.url);
    const parts = url.pathname.split("/").filter(Boolean);

    const username = parts[0];
    const slug = parts[1];

    const api = `https://vapor.my/worker/music/soundcloud/download/${username}/${slug}`;
    const res = await fetch(api);
    const data = await res.json();

    const mp3 = await fetch(data.streamUrl);
    const blob = await mp3.blob();

    const filename =
      track.title
        .replace(/[^a-z0-9\- ]/gi, "")
        .trim()
        .replace(/\s+/g, "-") + ".mp3";

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch {
    alert("Download failed");
  }
}
</script>

</body>
</html>
